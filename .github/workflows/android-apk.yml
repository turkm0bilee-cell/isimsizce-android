name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gradle dosyalarini hazirla
        run: |
          flutter create --platforms=android --org com.nurullahyrmz --project-name isimsizce_flutter /tmp/isimsizce-template
          cp /tmp/isimsizce-template/android/gradlew android/gradlew
          cp /tmp/isimsizce-template/android/gradlew.bat android/gradlew.bat
          cp /tmp/isimsizce-template/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk Isimsizce-v1.1.0-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Isimsizce-v1.1.0-test
          path: Isimsizce-v1.1.0-test.apk
          if-no-files-found: error
