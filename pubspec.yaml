name: isimsizce_flutter
description: "Isimsizce mobil uygulamasi"
publish_to: 'none'

version: 1.2.2+6

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: '#141625'
  adaptive_icon_foreground: 'assets/app_icon_foreground.png'
